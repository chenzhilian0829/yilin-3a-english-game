const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function saved(){try{return JSON.parse(localStorage.getItem('yl3a-progress')||'{}')}catch{return{}}} function saveProgress(id,stars){const p=saved();p[id]=Math.max(p[id]||0,stars);localStorage.setItem('yl3a-progress',JSON.stringify(p))}
function renderUnits(){const p=saved();$('#unitGrid').innerHTML=units.map(u=>`<button class="unit-card" data-id="${u.id}"><span class="num">Unit ${u.id}</span><span class="stars">${'⭐'.repeat(p[u.id]||0)}${'☆'.repeat(3-(p[u.id]||0))}</span><div class="pic">${u.icon}</div><h3>${u.title}</h3><p>${u.sub}</p></button>`).join('');$$('.unit-card').forEach(b=>b.onclick=()=>startUnit(+b.dataset.id));$('#totalStars').textContent=`已收集 ${Object.values(p).reduce((a,b)=>a+b,0)} 颗星`}
function show(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function startUnit(id){state.unit=units.find(u=>u.id===id);state.mode='words';$$('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode==='words'));$('#unitTitle').textContent=`Unit ${id} · ${state.unit.title}`;$('#unitSubtitle').textContent=state.unit.sub;buildQuestions();show('practice')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQuestions(){let q=[];if(state.mode==='words'||state.mode==='mix')q.push(...state.unit.words.map(x=>({...item(x),type:'单词 / 词组'})));if(state.mode==='sentences'||state.mode==='mix')q.push(...state.unit.sentences.map(x=>({...item(x),type:'短句'})));if(state.settings.shuffle)shuffle(q);state.questions=q;state.index=0;state.score=0;state.wrong=[];state.checked=false;$('#liveScore').textContent='0';renderQuestion()}
function item(x){return{answer:x[0],cn:x[1],pic:x[2]}}
function renderQuestion(){const q=state.questions[state.index];if(!q)return finish();state.checked=false;$('#questionNo').textContent=`第 ${state.index+1} / ${state.questions.length} 题`;$('#progressBar').style.width=`${state.index/state.questions.length*100}%`;$('#scenePic').textContent=q.pic;$('#cnClue').textContent=q.cn;$('#typeLabel').textContent=q.type;$('#answerInput').value='';$('#answerInput').className='answer-input';$('#answerInput').disabled=false;$('#feedback').innerHTML='<p>写完后按回车键，也可以点“检查答案”。</p>';$('#checkBtn').textContent='检查答案';$('#answerInput').focus();if(state.settings.autoSpeak)setTimeout(speakCurrent,300)}
function norm(s){let x=s.trim().replace(/[’‘]/g,"'").replace(/[。？！]/g,m=>({'。':'.','？':'?','！':'!'})[m]).replace(/\s+/g,' ');if(state.settings.lenient)x=x.toLowerCase().replace(/[.,!?…]/g,'').trim();return x}
function check(){if(state.checked){next();return}const q=state.questions[state.index], val=$('#answerInput').value;if(!val.trim()){shake($('#answerInput'));return}const ok=norm(val)===norm(q.answer);state.checked=true;$('#answerInput').disabled=true;$('#answerInput').classList.add(ok?'ok':'bad');if(ok){state.score++;$('#liveScore').textContent=state.score;$('#feedback').innerHTML='<strong style="color:#168260">答对啦，真棒！</strong><p>正确答案：'+escapeHtml(q.answer)+'</p>';confetti()}else{state.wrong.push(q);$('#feedback').innerHTML='<strong style="color:#c8403b">再记一记，下次一定会！</strong><p>正确答案：<b>'+escapeHtml(q.answer)+'</b></p>'}$('#checkBtn').textContent=state.index===state.questions.length-1?'查看成绩':'下一题'}
function next(){state.index++;renderQuestion()} function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function hint(){const q=state.questions[state.index];if(state.checked)return;const parts=q.answer.split(' '),hint=parts.map(w=>w[0]+(w.length>2?'＿'.repeat(Math.min(w.length-1,6)):'＿')).join(' ');$('#feedback').innerHTML=`<strong>小提示</strong><p>${escapeHtml(hint)} · 一共 ${q.answer.replace(/\s/g,'').length} 个字母</p>`}
let voiceList=[];
function loadVoices(){if(!('speechSynthesis'in window))return;voiceList=speechSynthesis.getVoices()||[]}
function speakCurrent(){
  if(!state.sound){$('#feedback').innerHTML='<strong>声音已关闭</strong><p>点击右上角的 🔇 可以重新打开声音。</p>';return}
  if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined'){$('#feedback').innerHTML='<strong>当前浏览器不支持朗读</strong><p>请用最新版 Edge 或 Chrome 打开此文件。</p>';return}
  const q=state.questions[state.index];
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(q.answer);
  const english=voiceList.filter(v=>/^en([-_]|$)/i.test(v.lang));
  u.voice=english.find(v=>/^en-GB/i.test(v.lang))||english.find(v=>/^en-US/i.test(v.lang))||english[0]||null;
  u.lang=u.voice?.lang||'en-US';u.rate=.72;u.pitch=1.08;
  u.onstart=()=>{$('#feedback').innerHTML='<strong style="color:#2b75c9">正在朗读……</strong><p>请听清楚，再开始默写。</p>'};
  u.onerror=()=>{$('#feedback').innerHTML='<strong>没有播放出来</strong><p>这台电脑可能没有安装英文语音包，请在 Edge/Chrome 中打开并检查系统声音。</p>'};
  speechSynthesis.speak(u);
}
function speakButton(button){
  if(!state.sound||!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined')return;
  const title=button.getAttribute('title')||button.querySelector('h3')?.textContent||button.closest('.setting')?.querySelector('b')?.textContent||button.textContent.replace(/[🔊🔇⚙←📋💡⭐✨🎉💛]/g,'').replace(/\s+/g,' ').trim();
  if(!title)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(title);
  u.lang='zh-CN';u.rate=.9;u.pitch=1;
  speechSynthesis.speak(u);
}
function copyReadingText(){
  const q=state.questions[state.index];
  const text=q.answer;
  const done=()=>{$('#feedback').innerHTML='<strong style="color:#2b75c9">已复制朗读文本</strong><p>可粘贴到任意 AI 语音工具生成英文音频。</p>'};
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); else fallbackCopy(text,done);
}
function openWriting(){
  const q=state.questions[state.index];
  $('#writeInput').value=$('#answerInput').value;
  $('#writeClue').textContent=q?`${q.cn} · ${q.type}`:'';
  $('#writeOverlay').classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>$('#writeInput').focus(),50);
}
function closeWriting(){
  $('#answerInput').value=$('#writeInput').value;
  $('#writeOverlay').classList.remove('open');
  document.body.style.overflow='';
  $('#answerInput').focus();
}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}finally{ta.remove()}}
function finish(){const n=state.questions.length,pct=Math.round(state.score/n*100),stars=pct>=90?3:pct>=70?2:pct>=50?1:0;saveProgress(state.unit.id,stars);$('#resultScore').textContent=`${state.score} / ${n}`;$('#resultPic').textContent=pct>=90?'🏆':pct>=70?'🌟':pct>=50?'👍':'🌱';$('#resultTitle').textContent=pct>=90?'闪亮满分选手！':pct>=70?'进步得很快！':pct>=50?'认真练习有收获！':'再练一次就会更好！';$('#resultText').textContent=state.wrong.length?`本次获得 ${stars} 颗星，还有 ${state.wrong.length} 道题可以继续加油。`:`本单元全部答对，获得 ${stars} 颗星！`;show('result');renderUnits()}
function confetti(){const box=$('#checkBtn').getBoundingClientRect(),bits=['⭐','✨','🎉','💛'];for(let i=0;i<10;i++){const e=document.createElement('i');e.className='confetti';e.textContent=bits[i%bits.length];e.style.left=(box.left+box.width/2)+'px';e.style.top=box.top+'px';e.style.setProperty('--x',(Math.random()*240-120)+'px');e.style.setProperty('--y',(-60-Math.random()*150)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),850)}}
function shake(e){e.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:260})}
$('#checkBtn').onclick=check;$('#answerInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check()}};$('#writeInput').oninput=()=>{$('#answerInput').value=$('#writeInput').value};$('#writeBtn').onclick=openWriting;$('#closeWriteBtn').onclick=closeWriting;$('#finishWriteBtn').onclick=closeWriting;$('#clearWriteBtn').onclick=()=>{$('#writeInput').value='';$('#answerInput').value='';$('#writeInput').focus()};$('#hintBtn').onclick=hint;$('#speakBtn').onclick=speakCurrent;$('#copyBtn').onclick=copyReadingText;$('#backBtn').onclick=()=>{speechSynthesis?.cancel();renderUnits();show('home')};$('#homeBtn').onclick=()=>{renderUnits();show('home')};$('#retryBtn').onclick=()=>{buildQuestions();show('practice')};
$$('.mode-btn').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;$$('.mode-btn').forEach(x=>x.classList.toggle('active',x===b));buildQuestions()});
$('#soundBtn').onclick=()=>{state.sound=!state.sound;$('#soundBtn').textContent=state.sound?'🔊':'🔇'};$('#settingsBtn').onclick=()=>$('#settingsModal').classList.add('open');$('#closeSettings').onclick=()=>$('#settingsModal').classList.remove('open');$('#settingsModal').onclick=e=>{if(e.target.id==='settingsModal')e.currentTarget.classList.remove('open')};$$('.switch').forEach(b=>b.onclick=()=>{const k=b.dataset.setting;state.settings[k]=!state.settings[k];b.classList.toggle('on',state.settings[k])});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.id==='speakBtn')return;speakButton(b)});
renderUnits();
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
</script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
