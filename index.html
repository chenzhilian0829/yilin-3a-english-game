<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八单元默写预览</title><style>body{font-family:Arial;margin:0;background:#eef8ff;color:#273043}.wrap{max-width:900px;margin:auto;background:#fffef9;min-height:100vh;padding:20px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tabs button{padding:12px 4px;border:2px solid #ccd6df;border-radius:8px;background:#fff;font-weight:bold}.tabs .on{background:#70d6b3;border-color:#273043}.stage{text-align:center;padding:42px 10px}.pic{font-size:80px}.en{font-size:40px;font-weight:bold;min-height:55px}.cn{font-size:25px;font-weight:bold}.bar{height:10px;background:#e5ebf0;border:2px solid #273043;border-radius:8px}.bar i{display:block;background:#70d6b3;height:100%;width:0}.controls{text-align:center;padding:18px}.controls button{padding:12px 18px;margin:4px;border:2px solid #273043;border-radius:8px;background:#fff;font-weight:bold}.play{background:#ff766f!important;color:white}</style><main class="wrap"><h2>译林版三年级上册英语 · 八单元默写</h2><nav class="tabs" id="tabs"></nav><section class="stage"><div class="pic" id="pic"></div><div id="count"></div><div class="cn" id="cn"></div><div class="en" id="en">准备听写</div><p id="hint">点击开始学习</p></section><div class="bar"><i id="bar"></i></div><div class="controls"><button class="play" id="play">▶ 开始学习</button><button id="prev">上一条</button><button id="next">下一条</button></div></main><script>
const U=[
['Unit 1','👋',['hello','hi','Good morning.','I','am','*ah','a','cat','Miss','Good afternoon.','class','goodbye','bye']],
['Unit 2','🪪',['what','is','your','name','my','Nice to meet you!','too','boy','and','girl','Mr (AmE Mr.)']],
['Unit 3','❓',['are','you','no','not','yes','*ha','Here I am!','but','*oh','sorry','*twin','we','*excuse me','class','in','with','right']],
['Unit 4','🤝',['this','friend','she','he','it','good','Thank you.','have','many']],
['Unit 5','👨‍👩‍👧',['mother','father','dad','mum (AmE mom)','brother','baby','sister','Good evening.','*quick','look','*pond','who','great','come','meet','family','say']],
['Unit 6','👪',['grandfather (grandpa)','uncle','aunt','grandmother (grandma)','cousin','cool','me','*wow','big','it','happy','love']],
['Unit 7','🎂',['Happy Birthday!','one','two','three','four','five','six','seven','eight','nine','ten','now','want','car','book','ball','cake','some','toy','for','OK','How old are you?','please','here','Here you are.',"You're welcome."]],
['Unit 8','🎨',['can','do','for','clean','table','draw','sing','take pictures','dance','Are you OK?','*dizzy','picture','*er','*fox','child (pl. children)','*thing','How lovely!']]];
const Z={hello:'你好',hi:'嗨',"Good morning.":'早上好',I:'我',am:'是',a:'一只',cat:'猫',Miss:'小姐',"Good afternoon.":'下午好',class:'同学们',goodbye:'再见',bye:'拜拜',what:'什么',is:'是',your:'你的',name:'名字',my:'我的',"Nice to meet you!":'很高兴认识你',too:'也',boy:'男孩',and:'和',girl:'女孩','Mr (AmE Mr.)':'先生',are:'是',you:'你',no:'不',not:'不是',yes:'是的',"Here I am!":'我在这里',but:'但是',sorry:'对不起',we:'我们','excuse me':'请问',in:'在……里面',with:'和……一起',right:'正确的',this:'这',friend:'朋友',she:'她',he:'他',it:'它',good:'好的',"Thank you.":'谢谢你',have:'有',many:'许多',mother:'妈妈',father:'爸爸',dad:'爸爸',mum:'妈妈','mum (AmE mom)':'妈妈',brother:'哥哥/弟弟',baby:'婴儿',sister:'姐姐/妹妹',"Good evening.":'晚上好',look:'看',who:'谁',great:'太棒了',come:'来',meet:'见面',family:'家庭',say:'说',grandfather:'爷爷/外公',uncle:'叔叔/舅舅',aunt:'阿姨/姑姑',grandmother:'奶奶/外婆',cousin:'表兄弟姐妹',cool:'酷',me:'我',big:'大的',happy:'开心的',love:'爱',"Happy Birthday!":'生日快乐',one:'一',two:'二',three:'三',four:'四',five:'五',six:'六',seven:'七',eight:'八',nine:'九',ten:'十',now:'现在',want:'想要',car:'汽车',book:'书',ball:'球',cake:'蛋糕',some:'一些',toy:'玩具',for:'给；为了',OK:'好的',"How old are you?":'你几岁？',please:'请',here:'这里',"Here you are.":'给你',"You're welcome.":'不客气',can:'能；会',do:'做',clean:'打扫',table:'桌子',draw:'画画',sing:'唱歌','take pictures':'拍照',dance:'跳舞',"Are you OK?":'你还好吗？',picture:'图画','child (pl. children)':'孩子',"How lovely!":'真可爱！'};
let u=0,i=0,playing=false,timer;const $=x=>document.querySelector(x);function key(t){return t.replace(/^\*/,'')}function meaning(t){let k=key(t);return Z[k]||({'*ah':'啊','*ha':'哈','*oh':'哦','*twin':'双胞胎','*excuse me':'请问','*quick':'快点','*pond':'池塘','*wow':'哇','*dizzy':'头晕','*er':'呃','*fox':'狐狸','*thing':'事情'}[t]||'请默写这个词')}function tabs(){ $('#tabs').innerHTML=U.map((x,n)=>`<button class="${n===u?'on':''}" data-i="${n}">${x[1]} ${x[0]}</button>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{stop();u=+b.dataset.i;i=0;tabs();render()})}function render(){let a=U[u][2][i];$('#pic').textContent=U[u][1];$('#count').textContent=`${U[u][0]} · ${i+1}/${U[u][2].length}`;$('#en').textContent=playing?a:'准备听写';$('#cn').textContent=playing?meaning(a):'';$('#hint').textContent=playing?'英文、中文各听两遍，然后默写英文':'点击开始学习';$('#bar').style.width=(i/U[u][2].length*100)+'%'}function speak(t,lang='en-US'){return new Promise(r=>{if(!speechSynthesis)return r();let s=new SpeechSynthesisUtterance(t);s.lang=lang;s.rate=lang==='zh-CN'?0.9:.75;s.onend=r;s.onerror=r;speechSynthesis.speak(s)})}function wait(ms){return new Promise(r=>timer=setTimeout(r,ms))}async function run(){playing=true;$('#play').textContent='⏸ 播放中';while(playing&&i<U[u][2].length){let a=U[u][2][i],cn=meaning(a);render();await speak(key(a));await speak(cn,'zh-CN');await speak(key(a));await speak(cn,'zh-CN');let ms=Math.min(12000,Math.max(3500,1800+key(a).replace(/[^A-Za-z]/g,'').length*300));$('#hint').textContent=`默写时间：${Math.ceil(ms/1000)} 秒`;await wait(ms);if(playing)i++}if(playing){playing=false;$('#play').textContent='↻ 再来一次';render()}}function stop(){playing=false;clearTimeout(timer);speechSynthesis?.cancel();$('#play').textContent='▶ 开始学习'}$('#play').onclick=()=>playing?stop():run();$('#prev').onclick=()=>{stop();i=Math.max(0,i-1);render()};$('#next').onclick=()=>{stop();i=Math.min(U[u][2].length-1,i+1);render()};tabs();render();</script>
