<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><title>三年级英语八单元视频学习</title><style>body{margin:0;background:#eaf7ff;color:#273043;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}.wrap{width:min(820px,100%);min-height:100vh;margin:auto;background:#fffef9;display:flex;flex-direction:column}.head{padding:18px 20px;border-bottom:2px solid #dfe5eb;font-weight:900;font-size:21px}.units{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px;background:#f5f9fc}.unitBtn{border:2px solid #dfe5eb;background:#fff;border-radius:8px;padding:9px 4px;font-weight:800;color:#526073;cursor:pointer}.unitBtn b{display:block;font-size:25px;margin-bottom:3px}.unitBtn.active{border-color:#273043;background:#70d6b3;color:#273043}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px 20px}.unit{color:#687387;font-size:15px}.pic{font-size:90px;min-height:105px;margin:10px}.cn{font-size:29px;font-weight:900}.en{font-size:40px;font-weight:1000;min-height:58px;word-break:break-word}.hint{color:#687387;margin-top:10px;font-size:16px}.bar{height:12px;background:#e5ebf0;border:2px solid #273043;border-radius:8px;margin:0 20px 18px;overflow:hidden}.bar i{display:block;height:100%;background:#70d6b3;width:0}.controls{display:flex;gap:10px;justify-content:center;padding:16px;flex-wrap:wrap}.controls button{border:2px solid #273043;background:#fff;border-radius:8px;padding:11px 15px;font-weight:900;font-size:15px;cursor:pointer}.controls .play{background:#ff766f;color:#fff}.note{padding:0 20px 18px;text-align:center;color:#687387;font-size:13px}@media(max-width:500px){.units{grid-template-columns:repeat(4,1fr);padding:10px 8px}.unitBtn{font-size:12px}.unitBtn b{font-size:21px}.en{font-size:32px}.cn{font-size:25px}}</style></head><body><main class="wrap"><div class="head">三年级英语 · 八单元视频学习</div><nav class="units" id="units"></nav><section class="stage"><div class="unit" id="count"></div><div class="pic" id="pic"></div><div class="cn" id="cn"></div><div class="en" id="en"></div><div class="hint" id="hint">选择单元后，点击“开始学习”</div></section><div class="bar"><i id="progress"></i></div><div class="controls"><button class="play" id="play">▶ 开始学习</button><button id="prev">上一条</button><button id="next">下一条</button></div><div class="note">每条英文自动朗读两遍，按单词或句子长度安排默写时间。</div></main><script>
const units=[
['第一单元','Hello!','👋',[['hello','你好','👋'],['Good morning.','早上好。','🌅'],['Miss','小姐；老师','👩‍🏫'],['hi','你好','😊'],['Good afternoon.','下午好。','☀️'],['class','同学们；班级','🏫'],['I','我','🙋'],["I'm",'我是（缩写）','🙋'],['Hello, Mike.','你好，迈克。','👋👦'],['Good morning, Miss Li.','早上好，李老师。','🌅👩‍🏫'],['Good afternoon, class.','下午好，同学们。','☀️🏫'],["Hi, I'm Liu Tao.",'你好，我是刘涛。','👦👋']]],
['第二单元','Are you...?','❓',[['are','是','🔤'],['you','你；你们','👉'],['yes','是；对','✅'],['am','是','🙋'],['no','不；不是','❌'],['not','不；没有','🚫'],['goodbye','再见','👋'],['Are you Su Hai?','你是苏海吗？','🤔👧'],['Yes, I am.','是的，我是。','✅🙋'],["No, I'm not.",'不，我不是。','❌🙋'],['Goodbye, Yang Ling.','再见，杨玲。','👋👧']]],
['第三单元','My friends','🤝',[['my','我的','💛'],['friend','朋友','🤝'],['she','她','👧'],["she's",'她是（缩写）','👧'],['he','他','👦'],["he's",'他是（缩写）','👦'],['too','也','➕'],['this','这；这个','👇'],['is','是','🔤'],['sister','姐姐；妹妹','👧'],["She's Yang Ling.",'她是杨玲。','👧'],["She's my friend.",'她是我的朋友。','👧🤝'],["He's Mike.",'他是迈克。','👦'],["He's my friend too.",'他也是我的朋友。','👦🤝'],['This is Tina.','这是蒂娜。','👇👧']]],
['第四单元','My family','👨‍👩‍👧',[['family','家庭；家人','👨‍👩‍👧'],['father','父亲；爸爸','👨'],['mother','母亲；妈妈','👩'],['brother','哥哥；弟弟','👦'],['me','我','🙋'],['grandpa','祖父；外祖父','👴'],['grandma','祖母；外祖母','👵'],['sister','姐姐；妹妹','👧'],['This is my family.','这是我的一家。','👨‍👩‍👧'],['This is my father.','这是我的爸爸。','👨'],['This is my mother.','这是我的妈妈。','👩'],['This is me.','这是我。','🙋'],['Good evening.','晚上好。','🌙']]],
['第五单元','Look at me','👕',[['look at','看；瞧','👀'],['T-shirt','T恤衫','👕'],['it','它','👉'],["it's",'它是（缩写）','👉'],['nice','好看的；好的','👍'],['skirt','短裙','👗'],['How nice!','真好看！','✨'],['cap','帽子','🧢'],['great','好极了','🌟'],['jacket','夹克衫','🧥'],['new','新的','🆕'],['red','红色的','🔴'],['Look at my T-shirt.','看我的T恤衫。','👀👕'],["It's nice.",'它很好看。','👍✨'],['How nice!','真好看！','✨'],['Look at my new skirt.','看我的新裙子。','👀👗'],['It’s great.','它好极了。','🌟']]],
['第六单元','Colours','🎨',[['colour','颜色','🎨'],['orange','橙色的','🟠'],['now','现在','⏰'],['green','绿色的','🟢'],['and','和；与','➕'],['yellow','黄色的','🟡'],['black','黑色的','⚫'],['blue','蓝色的','🔵'],['brown','棕色的','🟤'],['white','白色的','⚪'],['an','一个','1️⃣'],['egg','鸡蛋','🥚'],['or','或；还是','↔️'],['What colour is my T-shirt?','我的T恤衫是什么颜色？','❓👕'],["It's orange.",'它是橙色的。','🟠'],['What colour is it now?','它现在是什么颜色？','🎨❓'],["It's green and yellow.",'它是绿色和黄色的。','🟢🟡'],['Would you like an egg?','你想要一个鸡蛋吗？','🥚❓']]],
['第七单元','Would you like...?','🍰',[['a pie','一个馅饼','🥧'],['Nice to meet you.','很高兴认识你。','🤝'],['No, thank you.','不，谢谢你。','🙏'],['What about…?','……怎么样？','🤔'],['cake','蛋糕','🍰'],['ice cream','冰淇淋','🍦'],['sweet','糖果','🍬'],['hot dog','热狗','🌭'],['look','看；瞧','👀'],['what','什么','❓'],["what's",'是什么（缩写）','❓'],['Would you like a pie?','你想要一个馅饼吗？','🥧❓'],['Yes, please.','好的，太感谢了。','✅🙏'],['No, thank you.','不，谢谢你。','❌🙏'],['What about a cake?','来一块蛋糕怎么样？','🍰🤔'],['Nice to meet you.','很高兴认识你。','🤝😊']]],
['第八单元','Happy New Year!','🎁',[['Happy New Year!','新年快乐！','🎆'],['uncle','叔叔；伯伯；舅舅','👨'],['doll','玩具娃娃','🪆'],['that','那；那个','👉'],['ball','球','⚽'],['robot','机器人','🤖'],['CD','光盘','💿'],['car','小汽车','🚗'],['Happy Birthday!','生日快乐！','🎂'],['toy','玩具','🧸'],['Happy New Year!','新年快乐！','🎆'],['This is for you.','这是给你的。','🎁'],["What's this?",'这是什么？','❓👇'],["What's that?",'那是什么？','❓👉'],["It's a robot.",'它是一个机器人。','🤖'],['Happy Birthday!','生日快乐！','🎂']]]];
let u=0,i=0,playing=false,timer=null;const $=s=>document.querySelector(s);function renderUnits(){ $('#units').innerHTML=units.map((x,n)=>`<button class="unitBtn ${n===u?'active':''}" data-u="${n}"><b>${x[2]}</b>${x[0]}</button>`).join('');document.querySelectorAll('.unitBtn').forEach(b=>b.onclick=()=>{stop();u=+b.dataset.u;i=0;renderUnits();render()})}function render(){let x=units[u],a=x[3][i];$('#count').textContent=`${x[0]} · ${i+1} / ${x[3].length} 条`,$('#pic').textContent=a[2],$('#cn').textContent=a[1],$('#en').textContent=playing?'':'准备听写',$('#hint').textContent=playing?'请听清楚，马上开始默写':'点击“开始学习”后自动播放',$('#progress').style.width=`${i/x[3].length*100}%`}function say(t,lang='en-US'){return new Promise(r=>{if(!('speechSynthesis'in window)){r();return}speechSynthesis.cancel();let z=new SpeechSynthesisUtterance(t);z.lang=lang;z.rate=.72;z.onend=r;speechSynthesis.speak(z)})}async function run(){if(playing)return;playing=true;$('#play').textContent='⏸ 播放中';while(playing&&i<units[u][3].length){render();let a=units[u][3][i],n=a[0].replace(/[^a-z]/gi,'').length,ms=Math.min(14000,Math.max(4500,3500+n*450));$('#en').textContent=a[0];await say(a[0]);await new Promise(r=>setTimeout(r,350));await say(a[1],'zh-CN');await new Promise(r=>setTimeout(r,350));await say(a[0]);await new Promise(r=>setTimeout(r,350));await say(a[1],'zh-CN');if(!playing)break;$('#hint').textContent='现在请用纸笔默写';await new Promise(r=>timer=setTimeout(r,ms));if(playing)i++}if(playing){playing=false;$('#play').textContent='↻ 再来一次';$('#hint').textContent=`${units[u][0]}完成！`;render()}}function stop(){playing=false;clearTimeout(timer);speechSynthesis?.cancel();$('#play').textContent='▶ 开始学习'}$('#play').onclick=()=>{if(playing){stop();$('#play').textContent='▶ 继续学习';$('#hint').textContent='已暂停'}else{if(i>=units[u][3].length)i=0;run()}};$('#prev').onclick=()=>{stop();i=Math.max(0,i-1);render()};$('#next').onclick=()=>{stop();i=Math.min(units[u][3].length-1,i+1);render()};renderUnits();render();</script></body></html
